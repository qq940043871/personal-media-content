<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!-- HTML→视频 契约：总时长 15 秒（core/html_video.py 逐帧按绝对时间 seek） -->
<meta name="video-duration" content="15">
<title>为什么天空是蓝色的？</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: linear-gradient(180deg, #04091a 0%, #081030 45%, #0c1a45 100%);
    color: #eaf2ff; position: relative;
  }

  /* ===== 顶部进度条（15s 线性走满） ===== */
  .progress { position: fixed; top: 0; left: 0; right: 0; height: 12px; z-index: 99;
              background: rgba(255,255,255,.06); }
  .progress i { display: block; height: 100%; width: 100%;
                background: linear-gradient(90deg, #00e5ff, #ffd75e);
                transform-origin: left; transform: scaleX(0);
                animation: progress 15s linear both; }
  @keyframes progress { from { transform: scaleX(0); } to { transform: scaleX(1); } }

  /* ===== 场景层：各自用 15s 主时间线控制出入场 ===== */
  .scene { position: absolute; inset: 0; display: flex; flex-direction: column;
           align-items: center; justify-content: center; padding: 0 90px;
           opacity: 0; }
  .s1 { animation: s1 15s linear both; }
  .s2 { animation: s2 15s linear both; }
  .s3 { animation: s3 15s linear both; }
  .s4 { animation: s4 15s linear both; }
  /* 场景1: 0–2.8s 可见 / 场景2: 3–8.4s / 场景3: 8.5–12.2s / 场景4: 12.2s–末尾 */
  @keyframes s1 { 0%,18.6% { opacity: 1; } 21.3%,100% { opacity: 0; } }
  @keyframes s2 { 0%,20% { opacity: 0; } 24%,56% { opacity: 1; } 58.6%,100% { opacity: 0; } }
  @keyframes s3 { 0%,56.6% { opacity: 0; } 60%,81.3% { opacity: 1; } 83.3%,100% { opacity: 0; } }
  @keyframes s4 { 0%,81.3% { opacity: 0; } 84.6%,100% { opacity: 1; } }

  /* ===== 通用元素动画（绝对秒 delay，seek 友好） ===== */
  .pop { animation: pop .55s cubic-bezier(.2,1.6,.4,1) both; }
  @keyframes pop { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: scale(1); } }
  .rise { animation: rise .6s ease-out both; }
  @keyframes rise { from { opacity: 0; transform: translateY(50px); }
                    to { opacity: 1; transform: translateY(0); } }

  .badge { font-size: 38px; letter-spacing: 6px; color: #00e5ff;
           border: 3px solid rgba(0,229,255,.5); border-radius: 60px;
           padding: 16px 46px; margin-bottom: 70px; }
  .title { font-size: 108px; font-weight: 900; text-align: center; line-height: 1.25; }
  .title .q { color: #ffd75e; }
  .glow { animation: glow 2s ease-in-out infinite alternate; }
  @keyframes glow {
    from { text-shadow: 0 0 18px rgba(0,229,255,.35); }
    to   { text-shadow: 0 0 46px rgba(0,229,255,.85); } }
  .subtitle { font-size: 46px; color: #9fb3d9; margin-top: 60px; text-align: center; }

  /* ===== 场景2：太阳 → 大气 → 散射 ===== */
  .atmo { position: relative; width: 900px; height: 900px; margin-bottom: 60px; }
  .sun { position: absolute; top: -40px; right: 40px; width: 190px; height: 190px;
         border-radius: 50%; background: radial-gradient(circle, #fff3b0 30%, #ffd75e 70%);
         box-shadow: 0 0 90px 30px rgba(255,215,94,.45);
         animation: sunin .6s cubic-bezier(.2,1.6,.4,1) 3.3s both; }
  @keyframes sunin { from { opacity: 0; transform: scale(.4); }
                     to { opacity: 1; transform: scale(1); } }
  .ray { position: absolute; top: 130px; right: 120px; width: 26px; height: 560px;
         transform-origin: top; background: linear-gradient(180deg, rgba(255,243,176,.95), rgba(255,243,176,0));
         animation: raygrow .9s ease-out 3.6s both; }
  @keyframes raygrow { from { opacity: 0; transform: scaleY(0); }
                       to { opacity: 1; transform: scaleY(1); } }
  .molecule { position: absolute; top: 430px; right: 60px; width: 130px; height: 130px;
              border-radius: 50%; border: 4px dashed rgba(77,163,255,.8);
              display: flex; align-items: center; justify-content: center;
              font-size: 30px; color: #9fc7ff;
              animation: sunin .5s cubic-bezier(.2,1.6,.4,1) 4s both; }
  .dot { position: absolute; top: 480px; right: 110px; width: 26px; height: 26px;
         border-radius: 50%; background: #4da3ff; box-shadow: 0 0 16px #4da3ff;
         opacity: 0; animation: scatter 2.6s ease-out both; }
  @keyframes scatter {
    0% { opacity: 0; transform: translate(0, 0) scale(.6); }
    12% { opacity: .95; transform: translate(calc(var(--dx) * .18), calc(var(--dy) * .18)) scale(1); }
    100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(.5); } }
  .cap { font-size: 52px; font-weight: 700; text-align: center; line-height: 1.5; }
  .cap b { color: #4da3ff; }

  /* ===== 场景3：波长对比 ===== */
  .waves { width: 900px; display: flex; flex-direction: column; gap: 70px; margin-bottom: 80px; }
  .wrow { display: flex; align-items: center; gap: 40px; }
  .wlabel { width: 220px; font-size: 44px; font-weight: 700; text-align: right; }
  .wbar { flex: 1; height: 96px; border-radius: 48px; transform-origin: left; }
  .wred { background: repeating-linear-gradient(90deg, #ff6b6b 0 120px, transparent 120px 180px);
          animation: growx .8s ease-out 9s both; }
  .wblue { background: repeating-linear-gradient(90deg, #4da3ff 0 56px, transparent 56px 100px);
           animation: growx .8s ease-out 9.4s both, jitter .3s linear 10.2s 7; }
  @keyframes growx { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes jitter { from { transform: translateX(-8px); } to { transform: translateX(8px); } }
  .wcap { font-size: 56px; font-weight: 900; text-align: center; }
  .wcap .hl { color: #4da3ff; }

  /* ===== 场景4：结论 ===== */
  .card { background: rgba(255,255,255,.06); border: 3px solid rgba(0,229,255,.35);
          border-radius: 48px; padding: 90px 70px; text-align: center;
          box-shadow: 0 0 60px rgba(0,229,255,.15); }
  .card .big { font-size: 84px; font-weight: 900; line-height: 1.45; }
  .card .big b { color: #4da3ff; }
  .card .why { font-size: 44px; color: #9fb3d9; margin-top: 50px; line-height: 1.6; }
  .card .why b { color: #ffd75e; }
  .cta { margin-top: 90px; font-size: 46px; color: #00e5ff; letter-spacing: 4px; }
</style>
</head>
<body>
  <div class="progress"><i></i></div>

  <!-- 场景1：标题（0–3s） -->
  <section class="scene s1">
    <div class="badge pop" style="animation-delay:.2s">知识科普 · 第 1 期</div>
    <h1 class="title glow pop" style="animation-delay:.5s">为什么天空<br>是<span class="q">蓝色</span>的？</h1>
    <p class="subtitle rise" style="animation-delay:1.1s">15 秒讲清一个日常现象</p>
  </section>

  <!-- 场景2：阳光进入大气层（3–8.5s） -->
  <section class="scene s2">
    <div class="atmo">
      <div class="sun"></div>
      <div class="ray"></div>
      <div class="molecule">空气分子</div>
      <!-- 散射蓝光粒子：同一关键帧、不同方向与延迟 -->
      <div class="dot" style="--dx:-560px; --dy:-180px; animation-delay:4.3s"></div>
      <div class="dot" style="--dx:-620px; --dy:40px;   animation-delay:4.45s"></div>
      <div class="dot" style="--dx:-480px; --dy:220px;  animation-delay:4.6s"></div>
      <div class="dot" style="--dx:-640px; --dy:-60px;  animation-delay:4.75s"></div>
      <div class="dot" style="--dx:-520px; --dy:-280px; animation-delay:4.9s"></div>
      <div class="dot" style="--dx:-400px; --dy:180px;  animation-delay:5.05s"></div>
      <div class="dot" style="--dx:-580px; --dy:120px;  animation-delay:5.2s"></div>
      <div class="dot" style="--dx:-440px; --dy:-140px; animation-delay:5.35s"></div>
      <div class="dot" style="--dx:-300px; --dy:260px;  animation-delay:5.5s"></div>
      <div class="dot" style="--dx:-260px; --dy:-220px; animation-delay:5.65s"></div>
      <div class="dot" style="--dx:-660px; --dy:200px;  animation-delay:5.8s"></div>
      <div class="dot" style="--dx:-360px; --dy:60px;   animation-delay:5.95s"></div>
    </div>
    <p class="cap rise" style="animation-delay:4.1s">太阳光进入大气层<br>撞上空气分子</p>
    <p class="cap rise" style="animation-delay:5.6s"><b>蓝光</b>被弹向四面八方 →</p>
  </section>

  <!-- 场景3：波长对比（8.5–12.5s） -->
  <section class="scene s3">
    <div class="waves">
      <div class="wrow"><div class="wlabel">红光 · 长</div><div class="wbar wred"></div></div>
      <div class="wrow"><div class="wlabel">蓝光 · 短</div><div class="wbar wblue"></div></div>
    </div>
    <p class="wcap rise" style="animation-delay:10.4s">波长越<span class="hl">短</span>，散射越<span class="hl">强</span></p>
  </section>

  <!-- 场景4：结论（12.2s–结束） -->
  <section class="scene s4">
    <div class="card pop" style="animation-delay:12.5s">
      <p class="big">满天的<b>蓝光</b><br>就是天空的颜色</p>
      <p class="why">而夕阳时蓝光被散射得更多<br>剩下<b>红色</b>直达你眼睛</p>
    </div>
    <p class="cta rise" style="animation-delay:14s">关注 · 每天 15 秒涨知识</p>
  </section>
</body>
</html>
